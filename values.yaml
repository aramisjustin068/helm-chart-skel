# Default values for web-service.
# Override these per environment. Nothing here should be a surprise at 03:00.

replicaCount: 2

image:
  repository: ghcr.io/example/web-service
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

# Resource limits are not optional. A pod without them will eventually
# eat your node and you will find out during an incident, not during planning.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Probes that mean something. If your readiness probe is a TCP socket to a
# port that is always open, you do not have a readiness probe.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}

tolerations: []

affinity: {}

ingress:
  enabled: false
  className: ""
  host: ""
  path: /
